<style>

  <dialog id="pt-agent-access" class="pt-agent-access" aria-labelledby="pt-agent-title"><div class="pt-agent-heading"><h2 id="pt-agent-title">接入我的Agent</h2><button class="pt-icon-button" data-close-agent aria-label="关闭接入提示词"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="pt-agent-meta"><span id="pt-agent-project"></span><span class="pt-card-version" id="pt-agent-version"></span></div><p class="pt-agent-intro">复制以下提示词，发送给你正在使用的 Agent，由它完成安装、配置与验证。</p><label class="pt-agent-label" for="pt-agent-text"><span>接入提示词</span><span id="pt-agent-source"></span></label><textarea id="pt-agent-text" class="pt-agent-text" readonly spellcheck="false"></textarea><div class="pt-agent-footer"><span class="pt-agent-message" id="pt-agent-message" role="status"></span><button class="pt-button pt-button-primary" data-copy-agent><i data-lucide="copy" aria-hidden="true"></i>复制接入提示词</button></div></dialog>

  <dialog id="pt-share-prompt" class="pt-agent-access" aria-labelledby="pt-share-prompt-title"><div class="pt-agent-heading"><h2 id="pt-share-prompt-title">交给Agent调整</h2><button class="pt-icon-button" data-share-close aria-label="关闭提示词"><i data-lucide="x" aria-hidden="true"></i></button></div><p class="pt-agent-intro" id="pt-share-prompt-note"></p><label class="pt-agent-label" for="pt-share-context-text">完整提示词 · 演示上下文</label><textarea id="pt-share-context-text" class="pt-agent-text" readonly spellcheck="false"></textarea><div class="pt-agent-footer"><span id="pt-share-context-message" class="pt-agent-message" role="status"></span><button class="pt-button pt-button-primary" data-share-copy-context><i data-lucide="copy" aria-hidden="true"></i>复制提示词</button></div></dialog>
  <div id="pt-status" class="pt-status" role="status" hidden></div><div id="pt-live" class="pt-sr-only" aria-live="polite"></div>
</div>
<script type="application/json" id="pt-data">[]</script>
<script type="application/json" id="pt-user-copy">[]</script>
<script type="application/json" id="pt-capabilities">[]</script>
<script type="application/json" id="pt-project-metadata">{}</script>
<script>
(()=>{
  const root=document.getElementById('ai-tool-portal'),$=s=>root.querySelector(s);
  const tools=JSON.parse(document.getElementById('pt-data').textContent);
  const projectMetadata=new Map(JSON.parse(document.getElementById('pt-project-metadata').textContent).projects.map(x=>[x.id,x]));
  const copies=new Map(JSON.parse(document.getElementById('pt-user-copy').textContent).map(x=>[x.id,x]));
  const capabilities=new Map(JSON.parse(document.getElementById('pt-capabilities').textContent).map(x=>[x.id,x]));
  const copy=t=>copies.get(t.id),cap=t=>capabilities.get(t.id)||{capability:t.name,keywords:[]};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ico=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
  const iconRender=()=>globalThis.lucide?.createIcons({attrs:{width:16,height:16}});

  const examples=['将 Word 转为 Markdown，保留表格和图片','排查 Vue 页面内存泄漏','根据描述生成流程图','根据业务规则制作配置页面','查询并同步数据库中的数据','整理需求调研和访谈报告'];
  const state={schema:5,nav:'discover',draft:'',query:'',browsing:false,page:1,favorites:[],selected:null,tab:'overview',method:0,share:{stage:'prompt',outcome:'idle',progress:0,copied:false,added:false},selectedTags:[],authorTags:{}};
  let columns=4,pageSize=8,resizeFrame,toastTimer;
  let tagPickerOpen=false,tagSearch='',tagPage=1;
  let demo={kind:null,projectId:null,step:0,task:''};
  const tagKey=value=>String(value).trim().replace(/\s+/g,' ').toLocaleLowerCase();
  function cleanTags(values){const seen=new Set();return (Array.isArray(values)?values:[]).filter(x=>typeof x==='string').map(x=>x.trim().replace(/\s+/g,' ')).filter(x=>x&&[...x].length<=24&&!seen.has(tagKey(x))&&seen.add(tagKey(x))).slice(0,8)}
  function tagsOf(t){return Object.hasOwn(state.authorTags,t.id)?state.authorTags[t.id]:t.tags}
  function catalogTags(){const map=new Map();tools.forEach(t=>tagsOf(t).forEach(label=>{const key=tagKey(label);if(!map.has(key))map.set(key,{key,label,count:0});map.get(key).count++}));return [...map.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'zh-CN'))}
  function tagButtons(t){return tagsOf(t).length?`<div class="pt-tags" aria-label="作者标签">${tagsOf(t).map(label=>`<button class="pt-tag" data-filter-tag="${esc(label)}" aria-label="按标签 ${esc(label)} 筛选">${esc(label)}</button>`).join('')}</div>`:''}
  function matches(){return baseMatches().filter(({t})=>state.selectedTags.every(label=>tagsOf(t).some(tag=>tagKey(tag)===tagKey(label))))}
  function renderTagFilter(){
    $('#pt-tag-toggle').setAttribute('aria-expanded',String(tagPickerOpen));$('#pt-tag-picker').hidden=!tagPickerOpen;
    $('#pt-selected-tags').innerHTML=state.selectedTags.length?`<span class="pt-filter-hint">同时包含</span>${state.selectedTags.map(label=>`<button class="pt-tag" aria-pressed="true" data-remove-filter="${esc(label)}" aria-label="取消标签 ${esc(label)}">${esc(label)}${ico('x')}</button>`).join('')}<button class="pt-link" data-clear-tags>清空标签</button>`:'<span class="pt-filter-hint">按作者标签进一步筛选</span>';
    renderTagOptions();iconRender();
  }
  function renderTagOptions(){const all=catalogTags().filter(x=>tagKey(x.label).includes(tagKey(tagSearch))),pages=Math.max(1,Math.ceil(all.length/10));tagPage=Math.min(tagPage,pages);$('#pt-tag-options').innerHTML=all.slice((tagPage-1)*10,tagPage*10).map(x=>`<button class="pt-picker-option" data-toggle-tag="${esc(x.label)}" aria-pressed="${state.selectedTags.some(t=>tagKey(t)===x.key)}">${ico(state.selectedTags.some(t=>tagKey(t)===x.key)?'check-square':'square')}<span>${esc(x.label)}</span><small>${x.count}</small></button>`).join('')||'<span class="pt-filter-hint">没有匹配的作者标签</span>';$('#pt-tag-page-text').textContent=`${all.length} 个标签 · ${tagPage} / ${pages}`;$('#pt-tag-prev').disabled=tagPage===1;$('#pt-tag-next').disabled=tagPage===pages;iconRender()}
  function toggleTag(label){const exists=state.selectedTags.some(x=>tagKey(x)===tagKey(label));if(!exists&&state.selectedTags.length>=8){status('最多同时筛选 8 个标签');return}state.selectedTags=exists?state.selectedTags.filter(x=>tagKey(x)!==tagKey(label)):[...state.selectedTags,label];state.page=1;renderTagFilter();renderCards();$('#pt-live').textContent=`筛选后 ${matches().length} 项能力`;save()}
  function closeTagPicker(){tagPickerOpen=false;renderTagFilter()}

  const standalone=document.documentElement.hasAttribute('data-visualize-standalone');
  const stopWords=new Set(['我想','我要','我们','需要','想要','帮我','一个','一种','可以','能够','什么','这个','工具','能力','查找','找到','使用','进行','完成','希望','能否','相关','一些','一下','然后','以及','并且','怎么','如何','支持','生成','处理','实现','根据','提供','将','转为','转成','转换','保留']);
  const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('zh-CN',{granularity:'word'}):null;
  stopWords.add('描述');
  // Preserve registered capability terms such as 流程图 and 内存泄漏 when generic segmentation splits them.
  const capabilityTerms=[...new Set([...capabilities.values()].flatMap(c=>c.keywords.flatMap(k=>k.toLowerCase().match(/[a-z0-9+#]+|[\u4e00-\u9fff]+/g)||[])))].filter(x=>x.length>1&&!stopWords.has(x));
  function tokens(value){const s=value.toLowerCase();const parts=segmenter?[...segmenter.segment(s)].filter(x=>x.isWordLike).map(x=>x.segment):s.match(/[a-z0-9+#]+|[\u4e00-\u9fff]{2,}/g)||[];const terms=[...new Set([...parts,...capabilityTerms.filter(x=>s.includes(x))].filter(x=>x.length>1&&!stopWords.has(x)))];return terms.filter(x=>!terms.some(other=>other!==x&&other.includes(x)));}
  function baseMatches(){
    if(state.nav==='favorites')return tools.filter(t=>state.favorites.includes(t.id)).map(t=>({t,hits:[]}));
    if(state.browsing)return tools.map(t=>({t,hits:[]}));
    if(!state.query)return [];
    const q=state.query.toLowerCase(),terms=tokens(q);
    const ranked=tools.map(t=>{const c=cap(t),p=copy(t),primary=[c.capability,p.summary,...c.keywords,...tagsOf(t)].join(' ').toLowerCase(),secondary=[t.name,t.technicalName,p.outcome,...t.inputs,...t.outputs].join(' ').toLowerCase();const hits=terms.filter(term=>primary.includes(term)||secondary.includes(term));const score=hits.reduce((n,term)=>n+(primary.includes(term)?3:1),0)+c.keywords.filter(k=>q.includes(k.toLowerCase())).length*5;return {t,hits,score};}).filter(r=>r.score>0);
    const max=Math.max(0,...ranked.map(r=>r.score));
    return ranked.filter(r=>r.score>=Math.max(2,max*.42)).sort((a,b)=>b.score-a.score||Number(a.t.id==='auroraflow')-Number(b.t.id==='auroraflow'));
  }
  function restore(saved){
    const p=saved?.privateContent;if(!p||![3,4,5].includes(p.schema))return;
    if(p.schema===5&&p.share){const s=p.share;state.share={stage:['prompt','preview','result'].includes(s.stage)?s.stage:'prompt',outcome:['idle','running','success','partial'].includes(s.outcome)?s.outcome:'idle',progress:Math.min(3,Math.max(0,Number(s.progress)||0)),copied:!!s.copied,added:!!s.added};if(state.share.outcome==='running'){state.share.stage=state.share.progress>=2?'result':'preview';state.share.outcome=state.share.progress>=2?'partial':'idle'}}
    syncSharedApplication();state.favorites=Array.isArray(p.favorites)?p.favorites.filter(id=>tools.some(t=>t.id===id)):[];
    state.selectedTags=cleanTags(p.selectedTags);state.authorTags={};if(p.authorTags&&typeof p.authorTags==='object')tools.forEach(t=>{if(Array.isArray(p.authorTags[t.id]))state.authorTags[t.id]=cleanTags(p.authorTags[t.id])});
    state.nav=['discover','favorites','guide'].includes(p.nav)?p.nav:'discover';state.draft=String(p.draft||'').slice(0,800);state.query=String(p.query||'').slice(0,800);state.browsing=!!p.browsing;state.page=Math.max(1,Number(p.page)||1);state.selected=tools.some(t=>t.id===p.selected)?p.selected:null;state.tab=['overview','use','source'].includes(p.tab)?p.tab:'overview';state.method=Math.max(0,Number(p.method)||0);
  }
  function save(){const snapshot={modelContent:{portalView:state.nav,capabilityNeed:state.query||null,selectedTool:state.selected,selectedTags:state.selectedTags,publicationStage:state.share.stage},privateContent:{...state}};window.openai?.setWidgetState?.(snapshot).catch(()=>{});if(standalone)try{localStorage.setItem('ai-tool-portal-v3',JSON.stringify(snapshot))}catch{}}
  function status(message){clearTimeout(toastTimer);$('#pt-status').textContent=message;$('#pt-status').hidden=!message;if(message)toastTimer=setTimeout(()=>$('#pt-status').hidden=true,3200)}
  function renderNav(){root.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-pressed',String(state.nav===b.dataset.nav)));$('#pt-fav-count').textContent=state.favorites.length;$('#pt-catalog-count').textContent=tools.length;}
  const projectName=t=>t.name.replace(/（规划）$/, '');
  function favorite(t){return `<button class="pt-icon-button" data-favorite="${esc(t.id)}" aria-label="${state.favorites.includes(t.id)?'取消收藏':'收藏'}${esc(cap(t).capability)}" aria-pressed="${state.favorites.includes(t.id)}">${ico('bookmark')}</button>`}
  function cardTags(t){const tags=tagsOf(t),limit=tags.length>3?2:3;return `<div class="pt-tags pt-card-tags" aria-label="作者标签">${tags.slice(0,limit).map(label=>`<button class="pt-tag" data-filter-tag="${esc(label)}" aria-label="按标签 ${esc(label)} 筛选"><span class="pt-tag-label">${esc(label)}</span></button>`).join('')}${tags.length>limit?`<button class="pt-tag pt-tag-more" data-open="${esc(t.id)}" aria-label="查看全部 ${tags.length} 个标签">+${tags.length-limit}</button>`:''}</div>`}
  function card({t}){const m=projectMetadata.get(t.id);return `<article class="pt-tool" data-tool="${esc(t.id)}" aria-label="${esc(projectName(t))}"><div class="pt-card-top"><button class="pt-title-button" data-open="${esc(t.id)}" aria-label="查看 ${esc(projectName(t))}">${esc(projectName(t))}</button><span class="pt-card-version" aria-label="项目版本 ${esc(m.version)}">v${esc(m.version)}</span></div><p class="pt-description">${esc(copy(t).summary)}</p>${cardTags(t)}<div class="pt-card-bottom"><div class="pt-author-actions"><span class="pt-card-author" aria-label="作者 ${esc(t.owner)}">${ico('user-round')}<span>${esc(copy(t).helpLabel)}</span></span>${favorite(t)}</div><div class="pt-card-dates"><time class="pt-created" datetime="${esc(m.createdAt)}" aria-label="创建时间 ${esc(m.createdAt)}">${esc(m.createdAt)}</time><time class="pt-updated" datetime="${esc(m.updatedAt)}" aria-label="最后更新时间 ${esc(m.updatedAt)}">${esc(m.updatedAt)}</time></div></div></article>`}
  function renderCards(){
    if($('#pt-results').hidden||$('#pt-home').hidden)return;
    const found=matches(),pane=$('.pt-directory-scroll'),h=pane.clientHeight;
    columns=4;pageSize=8;$('#pt-tools').style.setProperty('--pt-card-height',`${Math.min(226,Math.max(190,Math.floor((h-18)/2)))}px`);
    function draw(){const pages=Math.max(1,Math.ceil(found.length/pageSize));state.page=Math.min(state.page,pages);const offset=(state.page-1)*pageSize;$('#pt-tools').style.setProperty('--pt-columns',columns);$('#pt-tools').innerHTML=found.length?found.slice(offset,offset+pageSize).map(card).join(''):`<div class="pt-empty"><h3>${state.selectedTags.length?'没有符合条件的能力':state.nav==='favorites'?'暂无收藏':'暂未找到匹配能力'}</h3><p>${state.selectedTags.length?'试试减少标签，或清空标签保留当前搜索。':state.nav==='favorites'?'在能力结果中收藏常用工具，方便再次访问。':'请补充工作目标、输入材料或预期产出。'}</p>${state.selectedTags.length?'<button class="pt-button" data-clear-tags>清空标签</button>':'<button class="pt-button" data-browse>浏览全部能力</button>'}</div>`;$('#pt-page-summary').textContent=found.length?`${offset+1}–${Math.min(offset+pageSize,found.length)} / ${found.length} 项`:'暂无结果';$('#pt-page-controls').innerHTML=pages>1?Array.from({length:pages},(_,i)=>`<button class="pt-page-button" data-page="${i+1}" ${state.page===i+1?'aria-current="page"':''}>${i+1}</button>`).join(''):'';}
    draw();
    $('#pt-results-title').textContent=state.nav==='favorites'?'我的收藏':state.browsing?'全部能力':'匹配结果';$('#pt-results-count').textContent=`${found.length} 项`;$('#pt-browse-link').hidden=state.browsing;pane.scrollTop=0;iconRender();
  }
  function renderHome(){const landing=state.nav==='discover'&&!state.query&&!state.browsing;$('#pt-home').classList.toggle('is-landing',landing);$('#pt-compose').hidden=state.nav==='favorites';$('#pt-results').hidden=landing;$('#pt-demand').value=state.draft;$('#pt-new-query').hidden=landing;$('#pt-query-note').classList.remove('pt-error');$('#pt-query-note').textContent='按已登记的能力与用途匹配 · 支持 Ctrl + Enter';$('#pt-query-error').textContent='';renderTagFilter();renderCards();}
  function submit(){const value=$('#pt-demand').value.trim();if(!value){$('#pt-query-note').textContent='请填写工作目标或预期产出。';$('#pt-query-note').classList.add('pt-error');$('#pt-query-error').textContent='请填写工作目标或预期产出。';$('#pt-demand').focus();return}Object.assign(state,{nav:'discover',draft:value,query:value,browsing:false,page:1,selected:null});render();$('#pt-live').textContent=`已找到 ${matches().length} 项相关能力`;save();}
  function home(){tagPickerOpen=false;Object.assign(state,{nav:'discover',draft:'',query:'',browsing:false,page:1,selected:null,selectedTags:[]});render();save();}
  function browse(){tagPickerOpen=false;Object.assign(state,{nav:'discover',draft:'',query:'',browsing:true,page:1,selected:null,selectedTags:[]});render();save();}
  // Entries are actionable only when their registered target or instructions exist.
  // The delivery form alone never establishes that an application is available.
  function entryUrl(value){try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:null}catch{return null}}
  function accessMode(t,m){return m?.accessMode||projectMetadata.get(t.id)?.accessMode||'agent'}
  function platformUrl(m){if(m?.demo&&m.demoKind==='app'){const id=m.demoProjectId;if(!projectMetadata.get(id)?.platformDemo)return null;const url=new URL('portal.html',standalone?location.href:'http://192.168.2.145:16088/preview/mv0rucyluos3nt/');url.searchParams.set('platform-demo',id);return url.href}return entryUrl(m?.url)}
  function detailEntries(t){return (projectMetadata.get(t.id)?.entries||t.entries||[]).filter(m=>m.status!=='unavailable'&&(accessMode(t,m)==='platform'?platformUrl(m):m.onboardingPrompt?.trim()))}
  const detailList=items=>`<ul class="pt-detail-list">${(items?.length?items:['尚未登记']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  function detailEntryState(t){
    const metadata=projectMetadata.get(t.id)||{},planned=metadata.lifecycle==='planned',entries=planned?[]:detailEntries(t);
    state.method=Math.max(0,Math.min(state.method,entries.length-1));
    return {planned,entries,m:entries[state.method]};
  }
  function usageGuide(t,{planned,m}){
    return `<details class="pt-project-info pt-usage-guide" id="pt-entry-guide" open><summary>使用步骤与说明</summary><p class="pt-usage-context"><strong>${planned?'当前建议':'开始之前'}：</strong>${esc(copy(t).firstStep)}</p>${m?.requirements?.length?`<p class="pt-usage-context"><strong>使用条件：</strong>${m.requirements.map(esc).join('；')}</p>`:''}${m?.steps?.length?`<ol class="pt-entry-steps">${m.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:m?.description?`<p class="pt-usage-context">${esc(m.description)}</p>`:''}${m?.command||m?.content?`<pre class="pt-code" id="pt-entry-copy-text">${esc(m.command||m.content)}</pre>`:''}</details>`;
  }
  function startPanel(t,{planned,entries,m}){
    const ready=!!m;
    const platform=accessMode(t,m)==='platform';
    const statusLabel=planned?'方案阶段':ready?(m.demo?'交互示例':platform?'平台链接已提供':'接入提示词已提供'):(platform?'平台链接待提供':'接入提示词待提供');
    const primary=platform&&ready?`<a class="pt-button pt-button-primary" href="${esc(platformUrl(m))}" target="_blank" rel="noopener noreferrer">打开平台${ico('arrow-up-right')}</a>`:`<button class="pt-button pt-button-primary" ${ready?'data-agent-access':'disabled'}>${ico(platform?'external-link':'bot')}${platform?'打开平台':'接入我的Agent'}</button>`;
    return `<aside class="pt-start-panel" aria-label="使用入口"><div><h2>使用入口</h2><span class="pt-entry-status ${ready?'is-ready':''}">${statusLabel}</span></div>${entries.length>1?`<label class="pt-section-label" style="margin:0" for="pt-entry-select">选择使用入口<select id="pt-entry-select" class="pt-entry-select">${entries.map((entry,i)=>`<option value="${i}" ${i===state.method?'selected':''}>${esc(entry.label||'使用入口')}</option>`).join('')}</select></label>`:''}${primary}<div class="pt-start-contact"><span>作者 · ${esc(copy(t).helpLabel||t.owner)}</span><button class="pt-link" data-consult>使用咨询${ico('arrow-up-right')}</button></div></aside>`;
  }
  function openAgentAccess(){
    const t=tools.find(t=>t.id===state.selected);if(!t)return;
    const {m}=detailEntryState(t);if(!m||accessMode(t,m)!=='agent'||!m.onboardingPrompt?.trim())return;
    const metadata=projectMetadata.get(t.id);
    $('#pt-agent-project').textContent=projectName(t);$('#pt-agent-version').textContent=`v${metadata.version}`;
    $('#pt-agent-source').textContent=m.demo?'设计示例':'作者提供';$('#pt-agent-text').value=m.onboardingPrompt;
    $('#pt-agent-message').textContent=m.demo?'Mock 提示词：用于体验接入流程，不执行真实安装。':'接入由你的 Agent 执行，完成后查看验证结果。';
    $('#pt-agent-access').showModal();$('#pt-agent-text').scrollTop=0;
  }
  async function copyAgentPrompt(){
    const field=$('#pt-agent-text'),message=$('#pt-agent-message');let copied=false;
    try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(field.value);copied=true}}catch{}
    if(!copied){field.focus();field.select();try{copied=document.execCommand('copy')}catch{}}
    message.textContent=copied?'已复制，粘贴到你的 Agent 对话即可。':'已选中完整提示词，请按 Ctrl + C 复制。';
  }
  function renderDetail(){
    const t=tools.find(t=>t.id===state.selected);if(!t)return;
    const entry=detailEntryState(t);
    const metadata=projectMetadata.get(t.id)||{},version=metadata.version?`v${metadata.version}`:'版本未登记';
    const dates=[['createdAt','pt-created','创建时间'],['updatedAt','pt-updated','最后更新时间']].map(([key,cls,label])=>metadata[key]?`<time class="${cls}" datetime="${esc(metadata[key])}" aria-label="${label} ${esc(metadata[key])}">${esc(metadata[key])}</time>`:`<span class="${cls}">${label}未登记</span>`).join('');
    const sourceRows=[['项目版本',version],['创建时间',metadata.createdAt||'未登记'],['更新时间',metadata.updatedAt||'未登记'],['作者',t.owner],['项目仓库',metadata.repository||t.source],['源码与文档',metadata.documentationSummary||'README、应用资料与 Agent 接入说明（示例）'],['首次任务',t.exampleTask||'用一份示例文档验证 Markdown 和图片输出'],['验证方法',metadata.verification||'确认示例输出完整并核对引用资源'],['使用边界',(t.boundaries||['示例内容用于流程设计，不代表实际业务验证']).join('；')],['数据说明','完整 Mock 资料，不代表真实项目发布信息']];
    $('#pt-detail').innerHTML=`<button class="pt-link pt-back" data-back>${ico('arrow-left')}${state.nav==='favorites'?'返回我的收藏':'返回能力结果'}</button><header class="pt-detail-header"><div class="pt-detail-heading"><div class="pt-detail-title"><h1>${esc(projectName(t))}</h1><span class="pt-card-version" aria-label="项目版本 ${esc(metadata.version||'未登记')}">${esc(version)}</span></div><p class="pt-detail-description">${esc(copy(t).summary)}</p><div class="pt-detail-meta"><span>${ico('user-round')}${esc(copy(t).helpLabel||t.owner)}</span>${tagButtons(t)}</div></div><div class="pt-detail-side-meta"><div class="pt-card-dates">${dates}</div>${favorite(t)}</div></header><div class="pt-detail-body"><article class="pt-detail-main"><section class="pt-detail-section"><h2>${ico('scan-line')}适用场景</h2><p>${esc(t.scenario)}</p></section><div class="pt-detail-io"><section class="pt-detail-section"><h2>${ico('folder-input')}准备材料</h2>${detailList(t.inputs)}</section><section class="pt-detail-section"><h2>${ico('file-check-2')}预期产出</h2>${detailList(t.outputs)}</section></div>${usageGuide(t,entry)}<details class="pt-project-info" id="pt-project-info"><summary>项目资料与使用边界</summary>${sourceRows.map(([label,value])=>`<div class="pt-source-row"><span>${esc(label)}</span><span>${esc(value)}</span></div>`).join('')}${t.needs?.length?`<div class="pt-source-row"><span>待确认事项</span><span>${t.needs.map(esc).join('；')}</span></div>`:''}</details></article>${startPanel(t,entry)}</div>`;
    iconRender();
  }
  function saveDemoFile(name,blob){if(!standalone)return false;const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;root.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);return true}
  /* PT_PLATFORM_DEMO */
  function openConsult(){
    const t=tools.find(t=>t.id===state.selected);if(!t)return;
    const planned=projectMetadata.get(t.id)?.lifecycle==='planned';
    $('#pt-consult-description').textContent=`复制以下内容后，通过你已有的沟通渠道联系 ${copy(t).helpLabel||t.owner}。`;
    $('#pt-consult-text').value=`你好，我想了解「${projectName(t)}」。\n\n我的需求：${state.query||'（请补充你的工作目标）'}\n\n${planned?'希望了解当前方案进展、适用范围和可体验的时间。':'请提供适用的使用入口、环境与权限要求，以及首次使用指引。'}\n\n谢谢。`;
    $('#pt-consult-message').textContent='仅生成咨询草稿，不会自动发送。';
    $('#pt-consult').showModal();
  }
  async function copyText(text,field,message){
    try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(text);if(message)message.textContent='已复制，可粘贴到沟通工具。';else status('已复制')}
    catch{if(field){field.focus();field.select();if(message)message.textContent='已选中内容，请按 Ctrl + C 复制。'}else status('请展开说明，选择并复制内容。')}
  }
  /* PT_PUBLISHER_FLOW */
  function render(){syncSharedApplication();renderNav();$('#pt-home').hidden=!!state.selected||state.nav==='guide';$('#pt-detail').hidden=!state.selected;$('#pt-guide').hidden=!!state.selected||state.nav!=='guide';if(!state.selected)$('#pt-detail').replaceChildren();if(state.nav!=='guide')$('#pt-guide').replaceChildren();if(state.selected)renderDetail();else if(state.nav==='guide')renderGuide();else renderHome();iconRender();}
  root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b){const card=e.target.closest('[data-tool]');if(card&&root.contains(card)&&!window.getSelection()?.toString()){state.selected=card.dataset.tool;state.tab='overview';state.method=0;render();save()}return}if(!root.contains(b)||b.disabled)return;
    if(!b.closest('.pt-filter-anchor'))tagPickerOpen=false;
    if(b.hasAttribute('data-home')||b.id==='pt-new-query'){home();$('#pt-demand').focus()}
    else if(b.hasAttribute('data-tag-browse')){browse();tagPickerOpen=true;renderTagFilter();$('#pt-tag-search').focus()}
    else if(b.id==='pt-tag-toggle'){tagPickerOpen=!tagPickerOpen;renderTagFilter();if(tagPickerOpen)$('#pt-tag-search').focus()}
    else if(['pt-tag-close','pt-tag-done'].includes(b.id)){closeTagPicker();$('#pt-tag-toggle').focus()}
    else if(b.id==='pt-tag-prev'||b.id==='pt-tag-next'){tagPage+=b.id==='pt-tag-prev'?-1:1;renderTagOptions()}
    else if(b.hasAttribute('data-toggle-tag'))toggleTag(b.dataset.toggleTag);
    else if(b.hasAttribute('data-remove-filter'))toggleTag(b.dataset.removeFilter);
    else if(b.hasAttribute('data-clear-tags')){state.selectedTags=[];state.page=1;renderTagFilter();renderCards();save()}
    else if(b.hasAttribute('data-filter-tag')){const label=b.dataset.filterTag;state.selectedTags=cleanTags([...state.selectedTags,label]);state.selected=null;state.page=1;if(state.nav==='guide'){state.nav='discover';state.browsing=true;state.query='';state.draft=''}tagPickerOpen=false;render();save()}
    else if(b.hasAttribute('data-share-copy')){state.share.copied=await copySharePrompt($('#pt-publish-text'),$('#pt-publish-copy-message'));save()}
    else if(b.hasAttribute('data-share-preview')){state.share.stage='preview';renderGuide();save()}
    else if(b.hasAttribute('data-share-prompt')){state.share.stage='prompt';renderGuide();save()}
    else if(b.hasAttribute('data-share-adjust'))openShareContext('adjust');
    else if(b.hasAttribute('data-share-repair'))openShareContext('repair');
    else if(b.hasAttribute('data-share-close'))$('#pt-share-prompt').close();
    else if(b.hasAttribute('data-share-copy-context'))await copySharePrompt($('#pt-share-context-text'),$('#pt-share-context-message'));
    else if(b.hasAttribute('data-share-publish'))await publishDemo('success');
    else if(b.hasAttribute('data-share-fail'))await publishDemo('partial');
    else if(b.hasAttribute('data-share-retry'))await publishDemo('success',true);
    else if(b.hasAttribute('data-share-restart')){Object.assign(state.share,{stage:'prompt',outcome:'idle',progress:0,copied:false});renderGuide();save()}
    else if(b.hasAttribute('data-share-view')){syncSharedApplication();Object.assign(state,{nav:'discover',selected:shareApp.id,browsing:true,draft:'',query:'',selectedTags:[],page:Math.ceil(tools.length/pageSize),method:0});render();save()}
    else if(b.hasAttribute('data-browse'))browse();
    else if(b.hasAttribute('data-example')){$('#pt-demand').value=examples[Number(b.dataset.example)];submit()}
    else if(b.dataset.nav){state.nav=b.dataset.nav;state.selected=null;state.page=1;render();save()}
    else if(b.dataset.open){state.selected=b.dataset.open;state.tab='overview';state.method=0;render();save()}
    else if(b.hasAttribute('data-back')){state.selected=null;if(state.nav==='guide')state.nav='discover';render();save()}
    else if(b.dataset.favorite){const id=b.dataset.favorite;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];render();save()}
    else if(b.dataset.page){state.page=Number(b.dataset.page);renderCards();save()}
    else if(b.hasAttribute('data-agent-access'))openAgentAccess();
    else if(b.hasAttribute('data-close-agent'))$('#pt-agent-access').close();
    else if(b.hasAttribute('data-copy-agent'))await copyAgentPrompt();
    else if(b.hasAttribute('data-demo-restart')){demo.step=0;renderPlatformDemo()}
    else if(b.hasAttribute('data-demo-next')){demo.step=Math.min(2,demo.step+1);renderPlatformDemo()}
    else if(b.hasAttribute('data-demo-back')){demo.step=Math.max(0,demo.step-1);renderPlatformDemo()}
    else if(b.hasAttribute('data-demo-report'))downloadPlatformReport();
    else if(b.hasAttribute('data-consult'))openConsult();
    else if(b.hasAttribute('data-close-consult'))$('#pt-consult').close();
    else if(b.hasAttribute('data-copy-consult'))await copyText($('#pt-consult-text').value,$('#pt-consult-text'),$('#pt-consult-message'));
    else if(b.hasAttribute('data-project-info')){const panel=$('#pt-project-info');panel.open=true;panel.scrollIntoView({block:'nearest'});panel.querySelector('summary').focus()}
    else if(b.dataset.tab){state.tab=b.dataset.tab;renderDetail();save()}
    else if(b.hasAttribute('data-method')){state.method=Number(b.dataset.method);renderDetail();save()}
  });
  root.addEventListener('change',e=>{if(e.target.id==='pt-entry-select'){state.method=Number(e.target.value);renderDetail();$('#pt-entry-select')?.focus();save()}else if(e.target.id==='pt-demo-task')demo.task=e.target.value;});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&tagPickerOpen){closeTagPicker();$('#pt-tag-toggle').focus()}});
  document.addEventListener('click',e=>{if(tagPickerOpen&&!e.composedPath().some(node=>node.classList?.contains('pt-filter-anchor')||node.hasAttribute?.('data-tag-browse')))closeTagPicker()});
  $('#pt-tag-search').addEventListener('input',e=>{tagSearch=e.target.value;tagPage=1;renderTagOptions()});
  $('#pt-demand-form').addEventListener('submit',e=>{e.preventDefault();submit()});
  $('#pt-demand').addEventListener('input',e=>{state.draft=e.target.value;$('#pt-query-error').textContent='';$('#pt-query-note').classList.remove('pt-error');$('#pt-query-note').textContent=state.query&&state.draft.trim()!==state.query?'需求已修改，点击“查找能力”更新结果。':'按已登记的能力与用途匹配 · 支持 Ctrl + Enter'});
  $('#pt-demand').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();submit()}});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();state.nav='discover';state.selected=null;render();$('#pt-demand').focus()}});
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render()}});
  new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(renderCards)}).observe($('.pt-directory-scroll'));
  $('#pt-examples').innerHTML=examples.map((text,i)=>`<button type="button" class="pt-example" data-example="${i}">${esc(text)}${ico('arrow-up-right')}</button>`).join('');
  if(standalone)try{restore(JSON.parse(localStorage.getItem('ai-tool-portal-v3')))}catch{}
  restore(window.openai?.widgetState);render();
  if(standalone){const id=new URLSearchParams(location.search).get('platform-demo'),m=projectMetadata.get(id);if(m?.platformDemo){root.classList.add('is-platform-demo');demo={kind:'app',projectId:id,step:0,task:m.platformDemo.tasks[0]};renderPlatformDemo();$('#pt-platform-demo').hidden=false;document.title=tools.find(t=>t.id===id).name+' · Mock 工作台'}}
})();
</script>
