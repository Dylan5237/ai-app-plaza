  <title>天宫到伏羲测试接入</title>

<body>
  <main>
    <p>专用测试入口 · 伏羲 16077</p>
    <h1>从天宫验证伏羲身份接入</h1>
    <p>请先在天宫正常登录。点击后打开独立广场测试页，再点击进入伏羲测试环境。</p>
    <p>不会修改共享目录中的正式入口。没有手工凭证输入；页面加载不会读取登录凭证。</p>
    <button id="open-test" type="button" disabled>打开广场测试入口</button>
    <p id="status" role="status">正在检查测试页面来源。</p>
  </main>
