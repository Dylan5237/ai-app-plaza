name: Publishing documentation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'server/contracts/**'
      - 'server/domain/manifest.ts'
      - 'server/domain/tags.ts'
      - 'server/domain/errors.ts'
      - 'scripts/check-publishing-docs.mjs'
      - 'package*.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'server/contracts/**'
      - 'server/domain/manifest.ts'
      - 'server/domain/tags.ts'
      - 'server/domain/errors.ts'
      - 'scripts/check-publishing-docs.mjs'
      - 'package*.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publishing-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publishing-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate examples, Schema reference and documentation links
        run: npm run test:docs
